name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ci-placeholder
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: financerag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Deploy secrets not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy API container
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "ubuntu@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/FinanceRAG-Analyst
          git pull --ff-only
          docker build -t financerag-api . 2>&1 | tail -3
          docker rm -f financerag-api || true
          docker run -d --name financerag-api --restart unless-stopped \
            --env-file ~/financerag.env -v ~/runtime:/app/runtime \
            -p 127.0.0.1:8000:7860 financerag-api
          REMOTE

      - name: Health check
        if: steps.check.outputs.enabled == 'true'
        run: |
          for i in $(seq 1 15); do
            if curl -fsS https://api.financerag.anishkale.dev/ready | grep -q '"ready"'; then
              echo "API is ready."; exit 0
            fi
            echo "Waiting for API ($i/15)..."; sleep 8
          done
          echo "API did not become ready in time."; exit 1
